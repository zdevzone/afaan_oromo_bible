[package]
name = "afaan-oromo-bible"
version = "0.1.0"
description = "Offline-first Afaan Oromo Bible reader — internal development"
edition = "2021"
publish = false

[lib]
name = "afaan_oromo_bible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "afaan-oromo-bible"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog"]
# Explicit internal test content; never enable on a public build.
development-content = []
# Embedded WebDriver is enabled only by the explicit native UI test build.
native-webdriver = ["desktop", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
# The Tauri CLI requires the same major/minor as the frontend plugin (2.4.x).
tauri-plugin-clipboard-manager = { version = "~2.4.2", optional = true }
tauri-plugin-dialog = { version = "~2.8.3", optional = true }
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
