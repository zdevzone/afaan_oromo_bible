[package]
name = "afaan-oromo-bible"
version = "0.1.0"
description = "Offline-first Afaan Oromo Bible reader — internal development"
edition = "2021"
publish = false

[lib]
name = "afaan_oromo_bible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "afaan-oromo-bible"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-clipboard-manager"]
# Explicit internal test content; never enable on a public build.
development-content = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
regex = "1"
